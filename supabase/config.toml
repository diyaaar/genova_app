[functions.account-recovery-006]
# This service-to-service operation authenticates with the secret API key in
# `apikey` plus a separate one-time recovery key checked by the function.
verify_jwt = false

[functions.create-choir]
# Only a verified user JWT may reach the database RPC. The RPC separately checks
# the private platform-operator allow-list; a choir-level role is insufficient.
verify_jwt = true

[functions.choir-invitations]
verify_jwt = true

[functions.resend-inbound]
# Resend is not a Supabase user. The handler authenticates the raw request with
# Svix HMAC signatures and timestamp checks before reading or forwarding mail.
verify_jwt = false
