name: Sync from Upstream (genesinovachoir)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync Repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key for upstream access
        run: |
          mkdir -p ~/.ssh
          echo "${ secrets.UPSTREAM_SYNC_KEY }" > ~/.ssh/upstream_key
          chmod 600 ~/.ssh/upstream_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Fetch and push changes from upstream
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/upstream_key -o IdentitiesOnly=yes" git remote add upstream git@github.com:genesinovachoir/genova_app.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/upstream_key -o IdentitiesOnly=yes" git fetch upstream --prune --tags
          for branch in $(git for-each-ref --format="%(refname:strip=3)" refs/remotes/upstream/); do
            if [ "$branch" != "HEAD" ]; then
              echo "Syncing branch: $branch"
              git push origin "refs/remotes/upstream/$branch:refs/heads/$branch" || echo "Branch $branch skipped or already up to date"
            fi
          done
          git push origin --tags || true
